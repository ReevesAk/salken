version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # One PR per week. Dependabot cannot regenerate requirements.lock, so
    # tests/test_requirements.py fails until the lock is refreshed; see the
    # README's Dependencies section.
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
