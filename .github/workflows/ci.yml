name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest --cov=accounts --cov=cart --cov=orders --cov=store --cov-report=term-missing

  postgres:
    # Production runs on PostgreSQL (RDS); the main job uses SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salken
          POSTGRES_USER: salken
          POSTGRES_PASSWORD: salken
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salken -d salken"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      RDS_DB_NAME: salken
      RDS_USERNAME: salken
      RDS_PASSWORD: salken
      RDS_HOSTNAME: localhost
      RDS_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t salken .

  audit:
    # Fails when any locked dependency has a published vulnerability.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit requirements.lock
        run: pip-audit -r requirements.lock --no-deps --disable-pip
