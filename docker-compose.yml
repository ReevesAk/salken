# Local development with PostgreSQL, matching production's database.
# Usage: docker compose up --build, then open http://localhost:8000/
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salken
      POSTGRES_USER: salken
      POSTGRES_PASSWORD: salken
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salken -d salken"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      RDS_DB_NAME: salken
      RDS_USERNAME: salken
      RDS_PASSWORD: salken
      RDS_HOSTNAME: db
      RDS_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
